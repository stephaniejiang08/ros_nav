# The controller remains inert unless enabled is explicitly overridden.
enabled: false
scan_topic: /scan
odom_topic: /odom
cmd_vel_topic: /cmd_vel

# Robot drives forward until a valid point appears in this front sector.
front_half_angle: 0.35
obstacle_distance: 0.45

# Motion values must be calibrated in simulation or bag replay first.
drive_speed: 0.12
turn_speed: 0.35
turn_angle: 1.57079632679
turn_tolerance: 0.04
turn_direction: 1
stop_duration: 0.5

# Missing sensor data stops the robot rather than using stale values.
scan_timeout: 0.5
odom_timeout: 0.5
loop_hz: 20.0
